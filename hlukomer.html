<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hlukoměr – Vernier Go Direct</title><script src="https://unpkg.com/@vernier/godirect/dist/godirect.min.umd.js"></script><style>:root{--bg:#f4f5f7;--text:#111827;--muted:#667085;--line:#d9dee7;--danger:#b42318;--ok:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}.app{width:min(1050px,calc(100% - 28px));margin:auto;padding:20px 0 38px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(1.35rem,2.5vw,2rem)}.transport,.seg{display:inline-flex;padding:4px;gap:4px;background:#e8edf3;border:1px solid #d6dde7;border-radius:13px}.transport label,.seg label{position:relative;padding:8px 13px;border-radius:9px;cursor:pointer;color:#475467;font-weight:750}.transport input,.seg input{position:absolute;opacity:0}.transport label:has(input:checked),.seg label:has(input:checked){background:#fff;color:#111827;box-shadow:0 1px 4px #0002}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 35px #0f172a0f;overflow:hidden;margin-bottom:12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line)}.status{font-size:.88rem;color:var(--muted)}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:650}button:disabled{opacity:.4}.primary{background:#111827;color:#fff;border-color:#111827}.danger{color:var(--danger)}.display{text-align:center;padding:28px 12px 20px}.reading{display:flex;justify-content:center;align-items:baseline;gap:.2em}.value{font-size:clamp(5rem,15vw,9rem);font-weight:800;line-height:.9;letter-spacing:-.06em}.unit{font-size:clamp(1.8rem,5vw,3.5rem);font-weight:750;color:#475467}.sub{color:var(--muted);margin-top:10px}.device{font-size:.78rem;color:var(--muted);text-align:center;padding-bottom:8px}.options{display:flex;justify-content:center;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);background:#fbfcfd;flex-wrap:wrap}.timed{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.timed input{width:76px;border:1px solid var(--line);border-radius:9px;padding:7px}.controls{display:flex;gap:7px;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}.controls button{flex:1;min-width:95px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px}.stat{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fbfcfd}.stat span{display:block;color:var(--muted);font-size:.8rem}.stat b{display:block;font-size:1.45rem;margin-top:3px}.chartwrap{padding:14px}canvas{width:100%;height:300px;display:block;border:1px solid var(--line);border-radius:16px;background:#fff}.section-title{font-weight:800}.saved{padding:0 14px 14px}.tablewrap{overflow:auto;max-height:280px;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{background:#f8fafc}.note{padding:12px 16px;color:var(--muted);font-size:.84rem}@media(max-width:720px){.app{width:calc(100% - 12px);padding-top:8px}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.value{font-size:clamp(4.2rem,24vw,7rem)}canvas{height:250px}}</style></head><body><div class="app"><header><h1>Hlukoměr</h1><div class="transport"><label><input type="radio" name="type" value="1" checked>Bluetooth</label><label><input type="radio" name="type" value="0">USB</label></div></header><section class="card"><div class="topbar"><b>Go Direct Sound</b><span id="status" class="status">nepřipojen</span></div><div class="display"><div class="reading"><span id="value" class="value">—</span><span id="unit" class="unit">dBA</span></div><div id="state" class="sub">připraven</div></div><div id="device" class="device"></div><div class="options"><span>Vážení:</span><div class="seg"><label><input type="radio" name="weight" value="A" checked>A</label><label><input type="radio" name="weight" value="C">C</label></div><div class="timed"><span>Časově:</span><button data-time="3">3 s</button><button data-time="5">5 s</button><button data-time="10">10 s</button><input id="customTime" type="number" min="1" value="30"><button id="customStart">Spustit</button></div></div><div class="controls"><button id="connect" class="primary">Připojit</button><button id="start" disabled>Start</button><button id="stop" disabled>Stop</button><button id="reset" disabled>Reset</button><button id="save" disabled>Uložit měření</button><button id="disconnect" disabled>Odpojit</button></div></section><section class="card"><div class="stats"><div class="stat"><span>Okamžitá</span><b id="now">— dB</b></div><div class="stat"><span>Maximum</span><b id="max">— dB</b></div><div class="stat"><span>Minimum</span><b id="min">— dB</b></div><div class="stat"><span>Leq 5 s</span><b id="avg5">— dB</b></div><div class="stat"><span>Leq měření</span><b id="avg">— dB</b></div></div><div class="chartwrap"><canvas id="chart" width="1200" height="360"></canvas></div></section><section class="card"><div class="topbar"><span class="section-title">Uložená měření</span><div><button id="csv">Stáhnout CSV</button> <button id="clearSaved" class="danger">Smazat vše</button></div></div><div class="saved"><div class="tablewrap"><table><thead><tr><th>Čas</th><th>Vážení</th><th>Délka</th><th>Min</th><th>Max</th><th>Leq</th></tr></thead><tbody id="savedBody"></tbody></table></div></div><div class="note">Měření používá přímo kalibrované kanály Sound level A-weighted a C-weighted čidla Vernier Go Direct Sound.</div></section></div><script>(()=>{'use strict';const $=s=>document.querySelector(s),S={device:null,sensor:null,running:false,weight:'A',samples:[],saved:JSON.parse(localStorage.getItem('vernierSoundSaved')||'[]'),timer:null,last:NaN};const E={status:$('#status'),value:$('#value'),unit:$('#unit'),state:$('#state'),device:$('#device'),connect:$('#connect'),disconnect:$('#disconnect'),start:$('#start'),stop:$('#stop'),reset:$('#reset'),save:$('#save'),now:$('#now'),max:$('#max'),min:$('#min'),avg5:$('#avg5'),avg:$('#avg'),canvas:$('#chart'),body:$('#savedBody')},ctx=E.canvas.getContext('2d');function status(t,c=''){E.status.textContent=t;E.status.className='status '+c}function fmt(v){return Number.isFinite(v)?v.toFixed(1):'—'}function leq(a){return a.length?10*Math.log10(a.reduce((s,x)=>s+10**(x.v/10),0)/a.length):NaN}function find(){return S.device.sensors.find(s=>S.weight==='A'?/sound level a-weighted/i.test(s.name):/sound level c-weighted/i.test(s.name))}function render(){let vals=S.samples.map(x=>x.v),last5=S.samples.filter(x=>performance.now()-x.t<=5000);E.value.textContent=fmt(S.last);E.now.textContent=fmt(S.last)+' dB';E.max.textContent=fmt(vals.length?Math.max(...vals):NaN)+' dB';E.min.textContent=fmt(vals.length?Math.min(...vals):NaN)+' dB';E.avg5.textContent=fmt(leq(last5))+' dB';E.avg.textContent=fmt(leq(S.samples))+' dB';E.save.disabled=!S.samples.length;draw()}function draw(){let c=E.canvas,w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e5e7eb';ctx.fillStyle='#667085';ctx.font='24px system-ui';for(let db=50;db<=110;db+=10){let y=h-35-(db-50)/60*(h-55);ctx.beginPath();ctx.moveTo(60,y);ctx.lineTo(w-15,y);ctx.stroke();ctx.fillText(db,8,y+8)}if(S.samples.length<2)return;let t1=S.samples.at(-1).t,t0=Math.max(S.samples[0].t,t1-60000);ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.beginPath();let first=true;for(let p of S.samples){if(p.t<t0)continue;let x=60+(p.t-t0)/Math.max(1000,t1-t0)*(w-75),y=h-35-(p.v-50)/60*(h-55);first?(ctx.moveTo(x,y),first=false):ctx.lineTo(x,y)}ctx.stroke()}function onValue(s){let v=Number(s.value);if(!Number.isFinite(v))return;S.last=v;if(S.running)S.samples.push({t:performance.now(),v});render()}async function selectChannel(){let sen=find();if(!sen)throw Error('Kanál Sound level '+S.weight+'-weighted nebyl nalezen.');S.device.sensors.forEach(s=>s.enabled=false);sen.enabled=true;S.sensor=sen;sen.on('value-changed',onValue);E.device.textContent=(S.device.name||'Go Direct Sound')+' · '+sen.name}async function connect(){try{status('připojuji…');S.device=await godirect.selectDevice($('input[name=type]:checked').value==='1');if(!S.device)throw Error('Zařízení nebylo vybráno.');await selectChannel();status('připojen','ok');E.connect.disabled=true;E.start.disabled=E.reset.disabled=E.disconnect.disabled=false}catch(e){status('chyba: '+e.message,'err')}}async function start(sec=0){if(!S.device)return;try{clearTimeout(S.timer);S.samples=[];S.running=true;let p=Math.max(5,S.sensor.specs?.measurementInfo?.minPeriod||100);S.device.minMeasurementPeriod=p;await S.device.start(p);E.start.disabled=true;E.stop.disabled=false;E.state.textContent=sec?'měření '+sec+' s':'měření běží';if(sec)S.timer=setTimeout(()=>stop(true),sec*1000)}catch(e){status('chyba startu: '+e.message,'err')}}async function stop(auto=false){if(!S.running)return;S.running=false;clearTimeout(S.timer);try{await S.device.stop()}catch{}E.start.disabled=false;E.stop.disabled=true;E.state.textContent=auto?'časové měření dokončeno':'měření zastaveno';render()}function reset(){S.samples=[];S.last=NaN;render();E.state.textContent='připraven'}async function disconnect(){if(S.running)await stop();try{await S.device?.close?.()}catch{}S.device=null;E.connect.disabled=false;E.start.disabled=E.stop.disabled=E.reset.disabled=E.save.disabled=E.disconnect.disabled=true;E.device.textContent='';status('nepřipojen')}function save(){if(!S.samples.length)return;let v=S.samples.map(x=>x.v);S.saved.unshift({time:new Date().toLocaleString('cs-CZ'),weight:S.weight,duration:(S.samples.at(-1).t-S.samples[0].t)/1000,min:Math.min(...v),max:Math.max(...v),avg:leq(S.samples)});localStorage.setItem('vernierSoundSaved',JSON.stringify(S.saved));saved()}function saved(){E.body.innerHTML=S.saved.map(x=>`<tr><td>${x.time}</td><td>${x.weight}</td><td>${x.duration.toFixed(1)} s</td><td>${fmt(x.min)}</td><td>${fmt(x.max)}</td><td>${fmt(x.avg)}</td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:#667085">Zatím žádná uložená měření</td></tr>'}function csv(){if(!S.saved.length)return;let r=[['Čas','Vážení','Délka [s]','Min [dB]','Max [dB]','Leq [dB]'],...S.saved.map(x=>[x.time,x.weight,x.duration.toFixed(2),x.min.toFixed(1),x.max.toFixed(1),x.avg.toFixed(1)])],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.join(';')).join('\r\n')],{type:'text/csv'}));a.download='vernier-hlukomer.csv';a.click()}E.connect.onclick=connect;E.start.onclick=()=>start();E.stop.onclick=()=>stop();E.reset.onclick=reset;E.disconnect.onclick=disconnect;E.save.onclick=save;document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>start(+b.dataset.time));$('#customStart').onclick=()=>start(Math.max(1,+$('#customTime').value||1));document.querySelectorAll('input[name=weight]').forEach(r=>r.onchange=async()=>{let was=S.running;if(was)await stop();S.weight=r.value;E.unit.textContent='dB'+S.weight;if(S.device)await selectChannel();reset()});$('#csv').onclick=csv;$('#clearSaved').onclick=()=>{if(confirm('Smazat všechna uložená měření?')){S.saved=[];localStorage.removeItem('vernierSoundSaved');saved()}};saved()})();</script></body></html>

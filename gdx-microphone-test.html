<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go Direct Sound – FFT test</title><script src="https://unpkg.com/@vernier/godirect/dist/godirect.min.umd.js"></script><style>body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}.app{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d9dee7;border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:9px 13px;border:1px solid #d9dee7;border-radius:10px;background:#fff}button.primary{background:#111827;color:#fff}.ok{color:#15803d}.err{color:#b42318}.big{font-size:42px;font-weight:800}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{width:100%;height:260px;border:1px solid #d9dee7;border-radius:12px;margin-top:10px}pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:12px;max-height:300px;overflow:auto}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><h1>Go Direct Sound – Microphone + FFT</h1><div class="card"><div class="row"><label><input type="radio" name="type" value="1" checked> Bluetooth</label><label><input type="radio" name="type" value="0"> USB</label><button id="connect" class="primary">Připojit</button><button id="start" disabled>Spustit</button><button id="stop" disabled>Stop</button><label>Perioda <select id="period"><option value="0.025">0,025 ms (40 kHz)</option><option value="0.05" selected>0,05 ms (20 kHz)</option><option value="0.1">0,1 ms (10 kHz)</option><option value="0.2">0,2 ms (5 kHz)</option></select></label></div><p id="status">Nepřipojeno</p><div id="sensor"></div></div><div class="card"><div class="muted">Dominantní frekvence</div><div class="big"><span id="peak">--</span> Hz</div><b>FFT 1024 vzorků</b><br><span id="rate" class="muted">--</span></div><div class="grid"><div class="card"><b>Zvuková vlna</b><span id="count" class="muted"></span><canvas id="wave" width="1000" height="300"></canvas></div><div class="card"><b>Frekvenční spektrum</b><canvas id="spectrum" width="1000" height="300"></canvas></div></div><div class="card"><b>Diagnostika</b><pre id="log"></pre></div></div><script>(()=>{const $=s=>document.querySelector(s),N=1024;let d,mic,vals=[],period=.05,last=0;const log=(...a)=>{$('#log').textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):x).join(' ')+'\n'},wave=$('#wave'),wc=wave.getContext('2d'),spec=$('#spectrum'),sc=spec.getContext('2d');function fft(a){let n=a.length,re=new Float64Array(n),im=new Float64Array(n);let mean=a.reduce((s,v)=>s+v,0)/n;for(let i=0;i<n;i++)re[i]=(a[i]-mean)*(.5-.5*Math.cos(2*Math.PI*i/(n-1)));for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}for(let l=2;l<=n;l<<=1){let ang=-2*Math.PI/l;for(let i=0;i<n;i+=l){let wr=1,wi=0,cr=Math.cos(ang),ci=Math.sin(ang);for(let j=0;j<l/2;j++){let k=i+j+l/2,vr=re[k]*wr-im[k]*wi,vi=re[k]*wi+im[k]*wr,ur=re[i+j],ui=im[i+j];re[i+j]=ur+vr;im[i+j]=ui+vi;re[k]=ur-vr;im[k]=ui-vi;let q=wr*cr-wi*ci;wi=wr*ci+wi*cr;wr=q}}}return Array.from({length:n/2},(_,i)=>Math.hypot(re[i],im[i]))}function drawWave(){let a=vals.slice(-1000);wc.clearRect(0,0,1000,300);if(a.length<2)return;let mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;wc.beginPath();a.forEach((v,i)=>{let x=i/(a.length-1)*1000,y=290-(v-mn)/r*280;i?wc.lineTo(x,y):wc.moveTo(x,y)});wc.stroke();$('#count').textContent=' · '+vals.length+' vzorků'}function analyze(){if(vals.length<N)return;let m=fft(vals.slice(-N)),fs=1000/period,best=2;for(let i=3;i<m.length-1;i++)if(m[i]>m[best])best=i;let y1=m[best-1],y2=m[best],y3=m[best+1],den=y1-2*y2+y3,delta=Math.abs(den)>1e-12?.5*(y1-y3)/den:0,hz=(best+delta)*fs/N;$('#peak').textContent=hz.toFixed(1);$('#rate').textContent=`vzorkování ${fs.toLocaleString('cs-CZ')} Hz · rozlišení ${(fs/N).toFixed(2)} Hz · Nyquist ${(fs/2).toLocaleString('cs-CZ')} Hz`;sc.clearRect(0,0,1000,300);let mx=Math.max(...m.slice(1)),bins=m.length-1;sc.beginPath();for(let i=1;i<=bins;i++){let x=i/bins*1000,y=285-m[i]/mx*270;i===1?sc.moveTo(x,y):sc.lineTo(x,y)}sc.stroke();sc.fillText('0 Hz',5,297);sc.fillText(Math.round(fs/2)+' Hz',930,297)}async function connect(){try{let bt=$('input[name=type]:checked').value==='1';$('#status').textContent='Připojuji…';d=await godirect.selectDevice(bt);if(!d)throw Error('Zařízení nebylo vybráno');log('Zařízení:',d.name,d.orderCode,d.serialNumber);d.sensors.forEach(s=>log({number:s.number,name:s.name,unit:s.unit,minPeriod:s.specs?.measurementInfo?.minPeriod,typicalPeriod:s.specs?.measurementInfo?.typicalPeriod}));mic=d.sensors.find(s=>/microphone|sound pressure/i.test(s.name||''));if(!mic)throw Error('Microphone nebyl nalezen');$('#sensor').textContent=`#${mic.number} ${mic.name} · min ${mic.specs.measurementInfo.minPeriod} ms · typ. ${mic.specs.measurementInfo.typicalPeriod} ms`;mic.on('value-changed',s=>{let v=Number(s.value);if(Number.isFinite(v)){vals.push(v);if(vals.length>20000)vals.splice(0,10000);if(vals.length%30===0)drawWave();let now=performance.now();if(vals.length>=N&&now-last>250){last=now;analyze()}}});$('#status').textContent='Připojeno';$('#status').className='ok';$('#start').disabled=$('#stop').disabled=false}catch(e){$('#status').textContent=e.message;$('#status').className='err';log('CHYBA',e.stack||e)}}function start(){vals=[];$('#peak').textContent='--';d.sensors.forEach(s=>s.enabled=false);mic.enabled=true;period=Number($('#period').value);d.minMeasurementPeriod=period;d.start(period);log('Start FFT',{periodMs:period,sampleRateHz:1000/period,fftSize:N});$('#status').textContent='Měřím…'}function stop(){d?.stop();$('#status').textContent='Zastaveno'}$('#connect').onclick=connect;$('#start').onclick=start;$('#stop').onclick=stop})();</script></body></html>

<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go Direct Sound – Microphone test</title><script src="https://unpkg.com/@vernier/godirect/dist/godirect.min.umd.js"></script><style>body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}.app{max-width:900px;margin:auto;padding:20px}.card{background:white;border:1px solid #d9dee7;border-radius:20px;padding:16px;margin-bottom:12px}button{font:inherit;padding:9px 13px;border:1px solid #d9dee7;border-radius:10px;background:white;cursor:pointer}button.primary{background:#111827;color:white}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ok{color:#15803d}.err{color:#b42318}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px;border-radius:12px;max-height:420px;overflow:auto}canvas{width:100%;height:240px;border:1px solid #d9dee7;border-radius:12px}select{font:inherit;padding:8px}</style></head><body><div class="app"><h1>Go Direct Sound – test Microphone</h1><div class="card"><div class="row"><label><input type="radio" name="type" value="1" checked> Bluetooth</label><label><input type="radio" name="type" value="0"> USB</label><button id="connect" class="primary">Připojit</button><button id="start" disabled>Spustit Microphone</button><button id="stop" disabled>Stop</button></div><p id="status">Nepřipojeno</p><div id="sensor"></div></div><div class="card"><b>Rychlá data</b><p>Test záměrně používá veřejný objekt godirect-js, ale snižuje interní minimální periodu pod běžných 10 ms. Nic neposílá mimo prohlížeč.</p><div class="row"><label>Perioda <select id="period"><option value="0.05">0,05 ms</option><option value="0.1">0,1 ms</option><option value="0.2">0,2 ms</option><option value="0.5">0,5 ms</option><option value="1">1 ms</option><option value="2">2 ms</option><option value="5">5 ms</option><option value="10">10 ms</option></select></label><span id="count">0 vzorků</span></div><canvas id="chart" width="1000" height="300"></canvas></div><div class="card"><b>Diagnostika</b><pre id="log"></pre></div></div><script>(()=>{const $=s=>document.querySelector(s),logEl=$('#log'),status=$('#status'),sensorEl=$('#sensor'),count=$('#count'),cv=$('#chart'),ctx=cv.getContext('2d');let d=null,mic=null,vals=[];const log=(...x)=>{logEl.textContent+=x.map(v=>typeof v==='object'?JSON.stringify(v,null,2):String(v)).join(' ')+'\n';logEl.scrollTop=logEl.scrollHeight};function draw(){ctx.clearRect(0,0,cv.width,cv.height);if(vals.length<2)return;let a=vals.slice(-1000),mn=Math.min(...a),mx=Math.max(...a),r=Math.max(1e-9,mx-mn);ctx.beginPath();a.forEach((v,i)=>{let x=i/(a.length-1)*cv.width,y=cv.height-(v-mn)/r*cv.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();count.textContent=vals.length+' vzorků · '+mn.toFixed(4)+' až '+mx.toFixed(4)}async function connect(){try{let bt=$('input[name=type]:checked').value==='1';status.textContent='Připojuji…';d=await godirect.selectDevice(bt);if(!d)throw Error('Zařízení nebylo vybráno');log('Zařízení:',d.name,d.orderCode,d.serialNumber);log('Kanály:');d.sensors.forEach(s=>log({number:s.number,name:s.name,unit:s.unit,minPeriod:s.specs?.measurementInfo?.minPeriod,typicalPeriod:s.specs?.measurementInfo?.typicalPeriod,mode:s.specs?.measurementInfo?.mode,mutualMask:s.specs?.mutalExclusionMask}));mic=d.sensors.find(s=>/microphone|sound pressure/i.test(s.name||''));if(!mic)throw Error('Kanál Microphone/Sound Pressure nebyl nalezen.');sensorEl.textContent=`#${mic.number} ${mic.name} [${mic.unit}] · min ${mic.specs?.measurementInfo?.minPeriod} ms · typ. ${mic.specs?.measurementInfo?.typicalPeriod} ms`;status.textContent='Připojeno';status.className='ok';$('#start').disabled=false;$('#stop').disabled=false;mic.on('value-changed',s=>{let v=Number(s.value);if(Number.isFinite(v)){vals.push(v);if(vals.length>50000)vals.splice(0,10000);if(vals.length%20===0)draw()}})}catch(e){status.textContent=e.message;status.className='err';log('CHYBA',e.stack||e)}}async function start(){try{vals=[];d.sensors.forEach(s=>s.enabled=false);mic.enabled=true;let p=Number($('#period').value);d.minMeasurementPeriod=p;log('Start:',{requestedPeriodMs:p,channel:mic.number,name:mic.name});d.start(p);status.textContent='Microphone běží…';status.className='ok'}catch(e){log('START CHYBA',e.stack||e);status.textContent='Start selhal: '+e.message;status.className='err'}}function stop(){try{d?.stop();status.textContent='Zastaveno'}catch(e){log('STOP CHYBA',e)}}$('#connect').onclick=connect;$('#start').onclick=start;$('#stop').onclick=stop;})();</script></body></html>

<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDX Sound – assembled packet test</title><script src="https://unpkg.com/@vernier/godirect/dist/godirect.min.umd.js"></script><style>body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}.app{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d9dee7;border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:9px 13px;border:1px solid #d9dee7;border-radius:10px;background:#fff}button.primary{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f8fafc;border-radius:14px;padding:12px}.big{font-size:34px;font-weight:800}.muted{color:#667085}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px;border-radius:12px;max-height:420px;overflow:auto}canvas{width:100%;height:230px;border:1px solid #d9dee7;border-radius:12px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><h1>Go Direct Sound – assembled packet test v2</h1><div class="card"><div class="row"><label><input type="radio" name="type" value="1" checked> Bluetooth</label><label><input type="radio" name="type" value="0"> USB</label><button id="connect" class="primary">Připojit</button><button id="start" disabled>Spustit</button><button id="stop" disabled>Stop</button><label>Perioda <select id="period"><option value="0.01">0,01 ms</option><option value="0.025">0,025 ms</option><option value="0.05" selected>0,05 ms</option><option value="0.1">0,1 ms</option></select></label></div><p id="status">Nepřipojeno</p><div id="sensor"></div></div><div class="card"><div class="grid"><div class="metric"><span class="muted">Measurement pakety</span><div class="big" id="packets">0</div></div><div class="metric"><span class="muted">Nejvyšší valueCount</span><div class="big" id="maxCount">0</div></div><div class="metric"><span class="muted">Vzorky z paketů</span><div class="big" id="samples">0</div></div><div class="metric"><span class="muted">Vzorků / s</span><div class="big" id="rate">--</div></div></div></div><div class="card"><b>Poslední sestavený measurement paket</b><pre id="packetInfo">Zatím nic.</pre></div><div class="card"><b>Zvuková vlna rozbalená přímo z paketů</b><canvas id="wave" width="1000" height="260"></canvas></div><div class="card"><b>Diagnostika</b><pre id="log"></pre></div></div><script>(()=>{const $=s=>document.querySelector(s);let d,mic,vals=[],packetN=0,sampleN=0,maxVC=0,startT=0,hooked=false;const log=(...a)=>{const e=$('#log');e.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+'\n';e.scrollTop=e.scrollHeight};const hex=v=>Array.from(new Uint8Array(v.buffer,v.byteOffset,v.byteLength)).map(x=>x.toString(16).padStart(2,'0')).join(' ');function draw(){let a=vals.slice(-1200),c=$('#wave'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(a.length<2)return;let mn=Math.min(...a),mx=Math.max(...a),r=Math.max(1e-9,mx-mn);x.beginPath();a.forEach((v,i)=>{let xx=i/(a.length-1)*c.width,yy=c.height-(v-mn)/r*c.height;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()}function parse(response){try{const type=response.getUint8(4);if(![0x06,0x07,0x08,0x09,0x0a,0x0b].includes(type))return;packetN++;$('#packets').textContent=packetN;let vc=0,index=0,isFloat=true,channel=null,mask=null,sensorCount=1;if(type===0x06){mask=response.getUint16(5,true);vc=response.getUint8(7);index=9;sensorCount=popcount(mask)}else if(type===0x07){mask=response.getUint32(5,true);vc=response.getUint8(9);index=11;sensorCount=popcount(mask)}else if(type===0x08||type===0x0a){channel=response.getUint8(6);vc=response.getUint8(7);index=8}else{channel=response.getUint8(6);vc=response.getUint8(7);index=8;isFloat=false}maxVC=Math.max(maxVC,vc);$('#maxCount').textContent=maxVC;let available=Math.floor((response.byteLength-index)/4),n=Math.min(vc*sensorCount,available),out=[];for(let i=0;i<n;i++){let p=index+i*4;out.push(isFloat?response.getFloat32(p,true):response.getInt32(p,true))}if(out.length){vals.push(...out);sampleN+=out.length;if(vals.length>12000)vals.splice(0,vals.length-6000);$('#samples').textContent=sampleN.toLocaleString('cs-CZ');let sec=(performance.now()-startT)/1000;if(sec>.25)$('#rate').textContent=Math.round(sampleN/sec).toLocaleString('cs-CZ');if(packetN%5===0)draw()}const info={bytes:response.byteLength,type:'0x'+type.toString(16).padStart(2,'0'),channel,mask,valueCount:vc,sensorCount,dataOffset:index,decodedValues:out.length,firstValues:out.slice(0,10),hex:hex(response)};$('#packetInfo').textContent=JSON.stringify(info,null,2);if(packetN<=5)log('MEASUREMENT',info)}catch(e){log('PARSE ERROR',e.stack||e)}}function popcount(n){n=n>>>0;let c=0;while(n){n&=n-1;c++}return c||1}function installHook(){if(hooked)return;if(typeof d._processMeasurements!=='function')throw Error('Interní parser _processMeasurements není dostupný');const original=d._processMeasurements;d._processMeasurements=function(response){parse(response);return original.call(this,response)};hooked=true;log('HOOK aktivní – instalován až po úspěšném otevření zařízení')}async function connect(){try{$('#status').textContent='Připojuji…';d=await godirect.selectDevice($('input[name=type]:checked').value==='1');if(!d)throw Error('Zařízení nebylo vybráno');mic=d.sensors.find(s=>/microphone/i.test(s.name||''));if(!mic)throw Error('Microphone nenalezen');installHook();$('#sensor').textContent=`#${mic.number} ${mic.name} · min ${mic.specs?.measurementInfo?.minPeriod} ms · typ. ${mic.specs?.measurementInfo?.typicalPeriod} ms`;$('#status').textContent='Připojeno – assembled parser aktivní';$('#start').disabled=$('#stop').disabled=false;log('Připojeno',{name:d.name,orderCode:d.orderCode,serialNumber:d.serialNumber})}catch(e){d=null;mic=null;hooked=false;$('#status').textContent='Chyba: '+e.message;log('CHYBA',e.stack||e)}}function start(){try{if(!d||!mic)throw Error('Nejdřív připoj čidlo');vals=[];packetN=sampleN=maxVC=0;startT=performance.now();$('#packets').textContent=$('#samples').textContent=$('#maxCount').textContent='0';$('#rate').textContent='--';d.sensors.forEach(s=>s.enabled=false);mic.enabled=true;let p=Number($('#period').value);d.minMeasurementPeriod=p;d.start(p);$('#status').textContent='Měřím sestavené pakety…';log('START',{periodMs:p,requestedRateHz:1000/p})}catch(e){log('START ERROR',e.stack||e);$('#status').textContent='Chyba startu: '+e.message}}function stop(){try{d?.stop();$('#status').textContent='Zastaveno';log('STOP',{measurementPackets:packetN,maxValueCount:maxVC,decodedSamples:sampleN,avgSamplesPerPacket:packetN?(sampleN/packetN).toFixed(2):0})}catch(e){log('STOP ERROR',e.message)}}$('#connect').onclick=connect;$('#start').onclick=start;$('#stop').onclick=stop})();</script></body></html>

<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go Direct Sound – Microphone FFT test</title><script src="https://unpkg.com/@vernier/godirect/dist/godirect.min.umd.js"></script><style>body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}.app{max-width:1000px;margin:auto;padding:20px}.card{background:white;border:1px solid #d9dee7;border-radius:20px;padding:16px;margin-bottom:12px}button,select{font:inherit;padding:9px 13px;border:1px solid #d9dee7;border-radius:10px;background:white}button{cursor:pointer}button.primary{background:#111827;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ok{color:#15803d}.err{color:#b42318}.big{font-size:42px;font-weight:800;margin:6px 0}.muted{color:#667085}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px;border-radius:12px;max-height:320px;overflow:auto}canvas{display:block;width:100%;height:260px;border:1px solid #d9dee7;border-radius:12px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><h1>Go Direct Sound – Microphone + FFT</h1><div class="card"><div class="row"><label><input type="radio" name="type" value="1" checked> Bluetooth</label><label><input type="radio" name="type" value="0"> USB</label><button id="connect" class="primary">Připojit</button><button id="start" disabled>Spustit</button><button id="stop" disabled>Stop</button><label>Perioda <select id="period"><option value="0.025">0,025 ms (40 kHz)</option><option value="0.05" selected>0,05 ms (20 kHz)</option><option value="0.1">0,1 ms (10 kHz)</option><option value="0.2">0,2 ms (5 kHz)</option></select></label></div><p id="status">Nepřipojeno</p><div id="sensor"></div></div><div class="card"><div class="row"><div><div class="muted">Dominantní frekvence</div><div class="big"><span id="peak">--</span> Hz</div></div><div><div class="muted">FFT</div><b id="fftInfo">4096 vzorků</b><br><span class="muted" id="rateInfo">--</span></div></div></div><div class="grid"><div class="card"><b>Zvuková vlna</b><span class="muted" id="count"></span><canvas id="wave" width="1000" height="300"></canvas></div><div class="card"><b>Frekvenční spektrum</b><canvas id="spectrum" width="1000" height="300"></canvas></div></div><div class="card"><b>Diagnostika</b><pre id="log"></pre></div></div><script>(()=>{const $=s=>document.querySelector(s),logEl=$('#log'),status=$('#status'),sensorEl=$('#sensor'),count=$('#count'),peakEl=$('#peak'),rateInfo=$('#rateInfo'),wc=$('#wave'),wctx=wc.getContext('2d'),sc=$('#spectrum'),sctx=sc.getContext('2d');let d=null,mic=null,vals=[],period=.05,lastFFT=0;const N=4096;const log=(...x)=>{logEl.textContent+=x.map(v=>typeof v==='object'?JSON.stringify(v,null,2):String(v)).join(' ')+'\n';logEl.scrollTop=logEl.scrollHeight};function drawWave(){let a=vals.slice(-1200);wctx.clearRect(0,0,wc.width,wc.height);if(a.length<2)return;let mn=Math.min(...a),mx=Math.max(...a),r=Math.max(1e-9,mx-mn);wctx.beginPath();a.forEach((v,i)=>{let x=i/(a.length-1)*wc.width,y=wc.height-(v-mn)/r*wc.height;i?wctx.lineTo(x,y):wctx.moveTo(x,y)});wctx.stroke();count.textContent=' · '+vals.length+' vzorků'}function fftReal(input){let n=input.length,re=new Float64Array(n),im=new Float64Array(n);for(let i=0;i<n;i++){let w=.5*(1-Math.cos(2*Math.PI*i/(n-1)));re[i]=input[i]*w}for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}for(let len=2;len<=n;len<<=1){let ang=-2*Math.PI/len,wr0=Math.cos(ang),wi0=Math.sin(ang);for(let i=0;i<n;i+=len){let wr=1,wi=0;for(let j=0;j<len/2;j++){let uR=re[i+j],uI=im[i+j],vR=re[i+j+len/2]*wr-im[i+j+len/2]*wi,vI=re[i+j+len/2]*wi+im[i+j+len/2]*wr;re[i+j]=uR+vR;im[i+j]=uI+vI;re[i+j+len/2]=uR-vR;im[i+j+len/2]=uI-vI;let nw=wr*wr0-wi*wi0;wi=wr*wi0+wi*wr0;wr=nw}}}let mag=new Float64Array(n/2);for(let i=0;i<mag.length;i++)mag[i]=Math.hypot(re[i],im[i]);return mag}function analyze(){if(vals.length<N)return;let a=vals.slice(-N),mean=a.reduce((s,v)=>s+v,0)/N;a=a.map(v=>v-mean);let mag=fftReal(a),fs=1000/period,maxBin=Math.floor(Math.min(mag.length-1,fs/2/(fs/N))),best=1;for(let i=2;i<maxBin;i++)if(mag[i]>mag[best])best=i;let delta=0;if(best>1&&best<mag.length-1){let y1=mag[best-1],y2=mag[best],y3=mag[best+1],den=y1-2*y2+y3;if(Math.abs(den)>1e-12)delta=.5*(y1-y3)/den}let hz=(best+delta)*fs/N;peakEl.textContent=hz.toFixed(1);rateInfo.textContent=`vzorkování ${fs.toLocaleString('cs-CZ')} Hz · rozlišení ${(fs/N).toFixed(2)} Hz · Nyquist ${(fs/2).toLocaleString('cs-CZ')} Hz`;drawSpectrum(mag,fs)}function drawSpectrum(mag,fs){sctx.clearRect(0,0,sc.width,sc.height);let maxHz=Math.min(10000,fs/2),bins=Math.floor(maxHz/(fs/N)),mx=0;for(let i=1;i<=bins;i++)mx=Math.max(mx,mag[i]);if(!mx)return;sctx.beginPath();for(let i=1;i<=bins;i++){let x=(i/bins)*sc.width,y=sc.height-(mag[i]/mx)*(sc.height-18);i===1?sctx.moveTo(x,y):sctx.lineTo(x,y)}sctx.stroke();sctx.fillText('0 Hz',5,sc.height-5);sctx.fillText(Math.round(maxHz)+' Hz',sc.width-65,sc.height-5)}async function connect(){try{let bt=$('input[name=type]:checked').value==='1';status.textContent='Připojuji…';d=await godirect.selectDevice(bt);if(!d)throw Error('Zařízení nebylo vybráno');log('Zařízení:',d.name,d.orderCode,d.serialNumber);d.sensors.forEach(s=>log({number:s.number,name:s.name,unit:s.unit,minPeriod:s.specs?.measurementInfo?.minPeriod,typicalPeriod:s.specs?.measurementInfo?.typicalPeriod,mode:s.specs?.measurementInfo?.mode,mutualMask:s.specs?.mutalExclusionMask}));mic=d.sensors.find(s=>/microphone|sound pressure/i.test(s.name||''));if(!mic)throw Error('Microphone nebyl nalezen');sensorEl.textContent=`#${mic.number} ${mic.name} · min ${mic.specs?.measurementInfo?.minPeriod} ms · typ. ${mic.specs?.measurementInfo?.typicalPeriod} ms`;mic.on('value-changed',s=>{let v=Number(s.value);if(Number.isFinite(v)){vals.push(v);if(vals.length>30000)vals.splice(0,10000);if(vals.length%30===0)drawWave();let now=performance.now();if(vals.length>=N&&now-lastFFT>250){lastFFT=now;analyze()}}});status.textContent='Připojeno';status.className='ok';$('#start').disabled=false;$('#stop').disabled=false}catch(e){status.textContent=e.message;status.className='err';log('CHYBA',e.stack||e)}}function start(){try{vals=[];peakEl.textContent='--';d.sensors.forEach(s=>s.enabled=false);mic.enabled=true;period=Number($('#period').value);d.minMeasurementPeriod=period;d.start(period);log('Start FFT:',{periodMs:period,sampleRateHz:1000/period,fftSize:N});status.textContent='Měřím…';status.className='ok'}catch(e){log('START CHYBA',e.stack||e);status.textContent='Start selhal: '+e.message;status.className='err'}}function stop(){try{d?.stop();status.textContent='Zastaveno'}catch(e){log('STOP CHYBA',e)}}$('#connect').onclick=connect;$('#start').onclick=start;$('#stop').onclick=stop;})();</script></body></html>

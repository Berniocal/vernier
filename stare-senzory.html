<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starší Vernier senzory – experimentální</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#667085;--line:#d9dee7;--dark:#101828;--blue:#2563eb;--green:#15803d;--red:#b42318}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,select{font:inherit}
.app{width:min(980px,calc(100% - 24px));margin:0 auto;padding:18px 0 34px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{margin:0;font-size:clamp(1.25rem,2.4vw,1.9rem)}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--text)}
button:hover{background:#f8fafc}
button:disabled{opacity:.42;cursor:not-allowed}
.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.status{font-size:.84rem;color:var(--muted)}
.status.ok{color:var(--green)}.status.err{color:var(--red)}
.device{padding:16px 14px 4px}
.device-name{font-size:1.35rem;font-weight:800}
.meta{margin-top:4px;color:var(--muted);font-size:.84rem;line-height:1.45}
.big{display:flex;align-items:baseline;justify-content:center;gap:.18em;min-height:210px;padding:18px}
.value{font-size:clamp(4.5rem,15vw,8.5rem);line-height:.86;font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.unit{font-size:1.4rem;font-weight:750;color:var(--muted)}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line)}
.controls button{flex:1;min-width:120px}
.controls label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem}
.controls select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px}
.graph-card{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.graph-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;gap:3px;padding:3px;background:#e8edf3;border:1px solid #d6dde7;border-radius:11px}
.seg button{border:0;background:transparent;color:#475467;border-radius:8px;padding:6px 10px;min-width:0}
.seg button.active{background:#fff;color:#111827;box-shadow:0 1px 2px rgba(15,23,42,.12)}
.graph-toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem}
.graph-toolbar select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px}
.graph-hint{margin-left:auto;color:var(--muted);font-size:.78rem}
.graph-wrap{position:relative;height:330px}
.graph-wrap canvas{display:block;width:100%;height:100%}
.graph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.88rem;pointer-events:none}
@media(max-width:680px){
  .app{width:calc(100% - 10px);padding:7px 0 18px}
  header{margin-bottom:7px}
  h1{font-size:1.05rem}
  header button{padding:6px 8px;font-size:.74rem}
  .big{min-height:175px;padding:12px}
  .value{font-size:clamp(4rem,22vw,6.5rem)}
  .controls{padding:6px;gap:4px}
  .controls button{min-width:0;padding:6px 5px;font-size:.76rem}
  .controls label{width:100%;justify-content:center}
  .graph-toolbar{gap:5px;padding:7px}
  .graph-toolbar label{font-size:.72rem}
  .graph-hint{width:100%;margin-left:0}
  .graph-wrap{height:260px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Starší Vernier senzory</h1>
    <button id="connect" class="primary">Připojit přes USB</button>
  </header>

  <section class="card">
    <div class="top">
      <strong>GoIO / WebHID</strong>
      <span id="status" class="status">nepřipojen</span>
    </div>

    <div class="device">
      <div id="deviceName" class="device-name">—</div>
      <div id="deviceMeta" class="meta">Podporované testovací typy: Go!Link, Go!Temp, Go!Motion.</div>
    </div>

    <div class="big">
      <span id="value" class="value">—</span>
      <span id="unit" class="unit">RAW</span>
    </div>

    <div class="controls">
      <button id="start" disabled>Start měření</button>
      <button id="stop" disabled>Stop</button>
      <button id="zero" disabled>Vynulovat</button>
      <button id="disconnect" disabled>Odpojit</button>
      <label>Perioda:
        <select id="period" disabled>
          <option value="40">40 ms</option>
          <option value="100">100 ms</option>
          <option value="200">200 ms</option>
          <option value="500">500 ms</option>
          <option value="1000">1 s</option>
        </select>
      </label>
    </div>
  </section>

  <section class="graph-card">
    <div class="graph-toolbar">
      <div class="seg" aria-label="Režim grafu">
        <button id="graphFit" type="button" class="active">Celý záznam</button>
        <button id="graphScroll" type="button">Posouvání</button>
      </div>
      <label>Okno:
        <select id="graphWindow">
          <option value="5">5 s</option>
          <option value="10" selected>10 s</option>
          <option value="20">20 s</option>
          <option value="60">60 s</option>
        </select>
      </label>
      <span id="graphHint" class="graph-hint">0 s zůstává vlevo, celý záznam se průběžně zmenšuje.</span>
    </div>
    <div id="graphWrap" class="graph-wrap">
      <canvas id="graph"></canvas>
      <div id="graphEmpty" class="graph-empty">Graf se začne kreslit po spuštění měření.</div>
    </div>
  </section>
</div>

<script>
(()=>{
'use strict';

const VERNIER_VID=0x08F7;
const PRODUCTS={
  0x0002:{name:'Go!Temp',tick:0.000128,defaultMs:500,kind:'temp'},
  0x0003:{name:'Go!Link',tick:0.001,defaultMs:40,kind:'link'},
  0x0004:{name:'Go!Motion',tick:0.001,defaultMs:50,kind:'motion'}
};

const CMD={
  START:0x18,STOP:0x19,INIT:0x1A,SET_PERIOD:0x1B,GET_PERIOD:0x1C,
  READ_REMOTE:0x27,GET_SENSOR_ID:0x28,SET_ANALOG_INPUT_CHANNEL:0x29
};

const state={
  device:null,info:null,outReportId:0,pending:new Map(),count:0,offset:0,lastRaw:NaN,lastValue:NaN,
  measuring:false,sensorId:null,dds:null,readingDDS:false,
  graphMode:'fit',graphData:[],sampleTime:0,lastDraw:0
};

const els={};
for(const id of ['connect','disconnect','start','stop','zero','period','status','deviceName','deviceMeta','value','unit','graphFit','graphScroll','graphWindow','graphHint','graphWrap','graph','graphEmpty']) els[id]=document.getElementById(id);
const graphCtx=els.graph.getContext('2d');

function log(msg){
  const t=new Date().toLocaleTimeString('cs-CZ');
  console.log(`[${t}] ${msg}`);
}

function setStatus(text,type=''){
  els.status.textContent=text;
  els.status.className='status'+(type?' '+type:'');
}

function hex(n,w=4){return '0x'+Number(n).toString(16).toUpperCase().padStart(w,'0')}

function collectReports(collections,key,out=[]){
  for(const c of collections||[]){
    for(const r of c[key]||[]) out.push(r);
    collectReports(c.children||[],key,out);
  }
  return out;
}

function findOutReportId(device){
  const reports=collectReports(device.collections,'outputReports');
  if(reports.length)return reports[0].reportId||0;
  return 0;
}

function packetBytes(event){
  return new Uint8Array(event.data.buffer,event.data.byteOffset,event.data.byteLength);
}

function resolveResponse(bytes){
  if(bytes.length<2)return;
  const cmd=bytes[1];
  const list=state.pending.get(cmd);
  if(list&&list.length){
    const item=list.shift();
    if(!list.length)state.pending.delete(cmd);
    clearTimeout(item.timer);
    item.resolve(bytes);
  }
}

function onInputReport(event){
  const b=packetBytes(event);
  if(!b.length)return;

  const packetType=b[0]&0xC0;
  if(packetType!==0){
    if(!(state.readingDDS && b[1]===CMD.READ_REMOTE)){
      log('RESP '+Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(' '));
    }
    resolveResponse(b);
    return;
  }

  if(!state.info)return;

  if(state.info.kind==='motion'){
    if(b.length>=7){
      const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
      const raw=dv.getInt32(2,true);
      const measType=b[6];
      acceptRaw(raw,`Go!Motion typ ${measType}`);
    }
    return;
  }

  const n=Math.min(b[0]&0x3F,3);
  if(n<1)return;
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  for(let i=0;i<n;i++){
    const pos=2+i*2;
    if(pos+1<b.length){
      const raw=dv.getInt16(pos,true);
      acceptRaw(raw);
    }
  }
}

function cleanUnit(unit){
  const u=String(unit||'').replace(/\0/g,'').trim();
  if(/^\(.+\)$/.test(u))return u.slice(1,-1);
  return u || '';
}

function formatMeasured(v){
  if(!Number.isFinite(v))return '—';
  const a=Math.abs(v);
  const digits=a>=1000?1:a>=100?2:a>=10?3:4;
  return v.toLocaleString('cs-CZ',{maximumFractionDigits:digits,minimumFractionDigits:0});
}

function rawToVolts(raw){
  if(state.dds?.operationType===2){
    return (10/32768)*raw;
  }
  return (2.5/32768)*raw+2.5;
}

function calibrateVoltage(x,dds=state.dds){
  if(!dds)return NaN;
  const p=dds.pages[dds.activePage]||dds.pages[0];
  const a=p.a,b=p.b,cc=p.c;
  let y=NaN;

  switch(dds.equation){
    case 0: y=x; break;
    case 1: y=b*x+a; break;
    case 2: y=cc*x*x+b*x+a; break;
    case 3: y=a*Math.pow(x,b); break;
    case 4: y=a*Math.pow(b,x); break;
    case 5: y=a+b*Math.log(x); break;
    case 6: y=a+b*Math.log(1/x); break;
    case 7: y=a*Math.exp(b*x); break;
    case 8: y=a*Math.exp(b/x); break;
    case 9: y=a*Math.pow(x,b*x); break;
    case 10:y=a*Math.pow(x,b/x); break;
    case 11:y=1/(a+b*Math.log(cc*x)); break;
    case 12:{
      const maxV=5,resistance=15000;
      const vx=Math.min(.999*maxV,Math.max(.001*maxV,x));
      const r=(vx*resistance)/(maxV-vx);
      y=1/(a+b*Math.log(r)+cc*Math.pow(Math.log(r),3));
      const u=cleanUnit(p.unit).toUpperCase();
      if(u==='C')y-=273.15;
      else if(u==='F')y=(y-273.15)*9/5+32;
      break;
    }
    default:y=NaN;
  }
  return Number.isFinite(y)?y:NaN;
}

function physicalValue(raw){
  if(!state.dds)return NaN;
  return calibrateVoltage(rawToVolts(raw),state.dds);
}

function graphDisplayUnit(){
  if(state.dds){
    const u=cleanUnit((state.dds.pages[state.dds.activePage]||state.dds.pages[0]).unit);
    const map={KPA:'kPa',PA:'Pa',HPA:'hPa',MPA:'MPa',V:'V',MV:'mV',A:'A',MA:'mA',N:'N',C:'°C',F:'°F'};
    return map[u.toUpperCase()]||u;
  }
  return 'RAW';
}

function graphValueFromRaw(raw){
  if(state.dds){
    const v=physicalValue(raw);
    return Number.isFinite(v)?v:NaN;
  }
  return raw;
}

function setGraphMode(mode){
  state.graphMode=mode;
  els.graphFit.classList.toggle('active',mode==='fit');
  els.graphScroll.classList.toggle('active',mode==='scroll');
  els.graphWindow.disabled=mode!=='scroll';
  els.graphHint.textContent=mode==='fit'
    ? '0 s zůstává vlevo, celý záznam se průběžně zmenšuje.'
    : 'Graf pokračuje doprava; čas 0 s postupně odjíždí doleva.';
  drawGraph();
}

function resizeGraph(){
  const r=els.graph.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(r.width*dpr));
  const h=Math.max(1,Math.round(r.height*dpr));
  if(els.graph.width!==w||els.graph.height!==h){
    els.graph.width=w;els.graph.height=h;
  }
  return {w,h,dpr};
}

function niceNumber(v){
  if(!Number.isFinite(v))return '—';
  const a=Math.abs(v);
  const d=a>=1000?0:a>=100?1:a>=10?2:3;
  return v.toLocaleString('cs-CZ',{maximumFractionDigits:d});
}

function drawGraph(){
  const {w,h,dpr}=resizeGraph();
  graphCtx.clearRect(0,0,w,h);
  graphCtx.fillStyle='#fff';
  graphCtx.fillRect(0,0,w,h);

  if(!state.graphData.length){
    els.graphEmpty.style.display='flex';
    return;
  }
  els.graphEmpty.style.display='none';

  const padL=58*dpr,padR=12*dpr,padT=18*dpr,padB=34*dpr;
  const W=w-padL-padR,H=h-padT-padB;
  const latest=state.graphData[state.graphData.length-1].t;
  let xMin=0,xMax=Math.max(latest,1);

  if(state.graphMode==='scroll'){
    const win=Math.max(1,Number(els.graphWindow.value)||10);
    xMax=Math.max(win,latest);
    xMin=Math.max(0,xMax-win);
  }

  let visible=state.graphData;
  if(state.graphMode==='scroll'){
    let first=0;
    while(first<visible.length && visible[first].t<xMin) first++;
    visible=visible.slice(Math.max(0,first-1));
  }

  const ys=[];
  for(const p of visible){
    if(p.t>=xMin&&p.t<=xMax&&Number.isFinite(p.y))ys.push(p.y-state.offset);
  }
  if(!ys.length)return;

  let yMin=Math.min(...ys),yMax=Math.max(...ys);
  if(yMin===yMax){
    const d=Math.max(Math.abs(yMin)*0.02,0.5);
    yMin-=d;yMax+=d;
  }else{
    const p=(yMax-yMin)*0.10;
    yMin-=p;yMax+=p;
  }

  const xOf=t=>padL+(t-xMin)/(xMax-xMin)*W;
  const yOf=v=>padT+(yMax-v)/(yMax-yMin)*H;

  graphCtx.strokeStyle='#e2e8f0';
  graphCtx.lineWidth=1*dpr;
  graphCtx.font=(10*dpr)+'px system-ui';
  graphCtx.fillStyle='#667085';
  graphCtx.textBaseline='top';
  graphCtx.textAlign='center';

  for(let i=0;i<=5;i++){
    const x=padL+W*i/5;
    graphCtx.beginPath();graphCtx.moveTo(x,padT);graphCtx.lineTo(x,padT+H);graphCtx.stroke();
    const t=xMin+(xMax-xMin)*i/5;
    graphCtx.fillText(niceNumber(t)+' s',x,padT+H+8*dpr);
  }

  graphCtx.textAlign='right';
  graphCtx.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const y=padT+H*i/4;
    graphCtx.beginPath();graphCtx.moveTo(padL,y);graphCtx.lineTo(padL+W,y);graphCtx.stroke();
    const v=yMax-(yMax-yMin)*i/4;
    graphCtx.fillText(niceNumber(v),padL-7*dpr,y);
  }

  graphCtx.textAlign='left';
  graphCtx.textBaseline='top';
  graphCtx.font='700 '+(11*dpr)+'px system-ui';
  graphCtx.fillStyle='#475467';
  graphCtx.fillText(graphDisplayUnit(),padL,padT-15*dpr);

  graphCtx.strokeStyle='#2563eb';
  graphCtx.lineWidth=2*dpr;
  graphCtx.lineJoin='round';
  graphCtx.lineCap='round';
  graphCtx.beginPath();

  const maxPoints=Math.max(300,Math.floor(W/dpr)*2);
  const step=Math.max(1,Math.ceil(visible.length/maxPoints));
  let started=false;
  for(let i=0;i<visible.length;i+=step){
    const p=visible[i];
    if(p.t<xMin||p.t>xMax||!Number.isFinite(p.y)){started=false;continue}
    const x=xOf(p.t),y=yOf(p.y-state.offset);
    if(!started){graphCtx.moveTo(x,y);started=true}else graphCtx.lineTo(x,y);
  }
  const last=visible[visible.length-1];
  if(last&&last.t>=xMin&&last.t<=xMax&&Number.isFinite(last.y)){
    const x=xOf(last.t),y=yOf(last.y-state.offset);
    if(!started)graphCtx.moveTo(x,y);else graphCtx.lineTo(x,y);
  }
  graphCtx.stroke();

  graphCtx.strokeStyle='#cbd5e1';
  graphCtx.lineWidth=1*dpr;
  graphCtx.strokeRect(padL,padT,W,H);
}

function scheduleGraphDraw(){
  const now=performance.now();
  if(now-state.lastDraw<35)return;
  state.lastDraw=now;
  requestAnimationFrame(drawGraph);
}

function acceptRaw(raw,note=''){
  state.lastRaw=raw;
  const base=graphValueFromRaw(raw);
  if(Number.isFinite(base)){
    state.graphData.push({t:state.sampleTime,y:base});
    if(state.graphData.length>120000)state.graphData.splice(0,state.graphData.length-120000);
    state.sampleTime+=Math.max(0.001,Number(els.period.value)/1000);
    scheduleGraphDraw();
  }
  state.count++;

  if(state.dds){
    const value=physicalValue(raw);
    state.lastValue=value;
    if(Number.isFinite(value)){
      els.value.textContent=formatMeasured(value-state.offset);
      els.unit.textContent=graphDisplayUnit();
    }else{
      els.value.textContent=String(raw);
      els.unit.textContent='RAW';
    }
  }else{
    state.lastValue=raw;
    els.value.textContent=String(raw-state.offset);
    els.unit.textContent='RAW';
  }

  if(note&&state.count<4)log(`MEAS raw=${raw} (${note})`);
}

async function sendPacket(bytes){
  if(!state.device)throw new Error('Zařízení není připojeno.');
  const packet=new Uint8Array(8);
  packet.set(bytes.slice(0,8));
  await state.device.sendReport(state.outReportId,packet);
}

function waitForResponse(cmd,timeout=1800){
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{
      const list=state.pending.get(cmd)||[];
      state.pending.set(cmd,list.filter(x=>x.resolve!==resolve));
      reject(new Error('Timeout odpovědi na příkaz '+hex(cmd,2)));
    },timeout);
    const list=state.pending.get(cmd)||[];
    list.push({resolve,reject,timer});
    state.pending.set(cmd,list);
  });
}

async function command(cmd,params=[],timeout=1800){
  const wait=waitForResponse(cmd,timeout);
  await sendPacket(Uint8Array.from([cmd,...params]));
  return wait;
}

function ascii(bytes,offset,length){
  let s='';
  for(let i=0;i<length;i++){
    const b=bytes[offset+i];
    if(!b)break;
    if(b>=32&&b<=126)s+=String.fromCharCode(b);
  }
  return s.trim();
}

function bitReverse8(x){
  let y=0;
  for(let i=0;i<8;i++){y=(y<<1)|(x&1);x>>=1}
  return y&255;
}

function verifyDDS(bytes){
  let xor=0;
  for(let i=0;i<127;i++)xor^=bytes[i];
  const stored=bytes[127];
  const exact=xor===stored;
  const legacy=((~xor)&255)===stored || bitReverse8(xor)===stored;
  const allSame=bytes.every(b=>b===bytes[0]);
  const bcdYear=((bytes[5]>>4)<=9)&&((bytes[5]&15)<=9);
  const bcdWeek=((bytes[6]>>4)<=5)&&((bytes[6]&15)<=9);
  return {ok:!allSame&&(exact||legacy||(bcdYear&&bcdWeek)),exact,xor,stored};
}

function parseDDS(bytes){
  if(bytes.length!==128)throw new Error('DDS záznam nemá 128 bajtů.');
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const pages=[];
  for(let i=0;i<3;i++){
    const o=70+i*19;
    pages.push({
      a:dv.getFloat32(o,true),
      b:dv.getFloat32(o+4,true),
      c:dv.getFloat32(o+8,true),
      unit:ascii(bytes,o+12,7)
    });
  }
  return {
    memMapVersion:bytes[0],
    sensorNumber:bytes[1],
    serial:bytes[2]|(bytes[3]<<8)|(bytes[4]<<16),
    manufacturer:bytes[7],
    longName:ascii(bytes,8,20),
    shortName:ascii(bytes,28,12),
    minSamplePeriod:dv.getFloat32(44,true),
    typSamplePeriod:dv.getFloat32(48,true),
    typSamples:dv.getUint16(52,true),
    warmup:dv.getUint16(54,true),
    operationType:bytes[57],
    equation:dv.getInt8(58),
    ymin:dv.getFloat32(59,true),
    ymax:dv.getFloat32(63,true),
    highestPage:bytes[68],
    activePage:Math.min(bytes[69],2),
    pages,
    checksum:verifyDDS(bytes)
  };
}

function equationName(n){
  return ({
    0:'bez kalibrace',1:'lineární',2:'kvadratická',3:'mocninná',4:'modifikovaná mocninná',
    5:'logaritmická',6:'modifikovaná logaritmická',7:'exponenciální',8:'modifikovaná exponenciální',
    9:'geometrická',10:'modifikovaná geometrická',11:'reciproční log',12:'Steinhart–Hart'
  })[n]||('typ '+n);
}

async function readRemoteDDS(){
  const bytes=new Uint8Array(128);
  state.readingDDS=true;
  try{
    log('Čtu DDS paměť čidla (128 B)…');
    for(let addr=0;addr<128;addr+=6){
      const count=Math.min(6,128-addr);
      const r=await command(CMD.READ_REMOTE,[addr,count],2500);
      if((r[0]&0x20)!==0){
        throw new Error('Go!Link vrátil chybu při čtení DDS na adrese '+addr+'.');
      }
      const valid=r[0]&0x07;
      const payloadCount=Math.max(0,valid-1);
      if(payloadCount<count){
        throw new Error('Neúplná DDS odpověď na adrese '+addr+' ('+payloadCount+'/'+count+' B).');
      }
      bytes.set(r.slice(2,2+count),addr);
    }
  }finally{
    state.readingDDS=false;
  }

  const dds=parseDDS(bytes);
  if(!dds.checksum.ok)throw new Error('DDS kontrolní součet nesouhlasí.');
  if(dds.highestPage>2||dds.activePage>dds.highestPage){
    throw new Error('DDS obsahuje neplatný index kalibrační stránky.');
  }
  return dds;
}

async function configureSmartSensor(dds){
  const channel=dds.operationType===2 ? 1 : 2;
  await command(CMD.SET_ANALOG_INPUT_CHANNEL,[channel]);
  log('Analogový vstup: '+(channel===1?'±10 V':'0–5 V'));

  const minMs=Math.max(1,Math.ceil(dds.minSamplePeriod*1000));
  let selected=Number(els.period.value);
  if(selected<minMs){
    if(![...els.period.options].some(o=>Number(o.value)===minMs)){
      const o=document.createElement('option');
      o.value=String(minMs);o.textContent=minMs+' ms (minimum čidla)';
      els.period.prepend(o);
    }
    els.period.value=String(minMs);
    log('Perioda upravena na minimum čidla: '+minMs+' ms');
  }
}

function showDDS(dds){
  const page=dds.pages[dds.activePage]||dds.pages[0];
  const unit=cleanUnit(page.unit);
  els.unit.textContent=graphDisplayUnit();
  els.deviceMeta.textContent=(dds.longName||dds.shortName||'BTA čidlo')+
    (Number.isFinite(dds.minSamplePeriod)?' · min. '+Math.round(dds.minSamplePeriod*1000)+' ms':'');
  log('DDS: '+(dds.longName||dds.shortName||'bez názvu')+', jednotka '+(unit||'—')+
      ', kalibrace '+equationName(dds.equation)+', stránka '+dds.activePage);
}

async function initDevice(){
  log('INIT '+hex(CMD.INIT,2));
  try{
    await command(CMD.INIT,[],6000);
    log('INIT OK');
  }catch(e){
    log('INIT: '+e.message+' — pokračuji v testu.');
  }

  state.sensorId=null;
  state.dds=null;
  els.unit.textContent='RAW';

  if(state.info.kind==='link'){
    try{
      const r=await command(CMD.GET_SENSOR_ID);
      if(r.length>=6){
        const dv=new DataView(r.buffer,r.byteOffset,r.byteLength);
        const id=dv.getUint32(2,true);
        state.sensorId=id;
        log('Sensor ID: '+id);

        if(id>=20 && id<=255){
          try{
            const dds=await readRemoteDDS();
            state.dds=dds;
            showDDS(dds);
            await configureSmartSensor(dds);
          }catch(ddsErr){
            state.dds=null;
            log('DDS se nepodařilo načíst: '+ddsErr.message);
          }
        }else{
          log('Sensor ID '+id+' je nechytré čidlo; zatím zůstávám v RAW.');
        }
      }
    }catch(e){
      log('Sensor ID se nepodařilo načíst: '+e.message);
    }
  }
}

async function setPeriod(){
  let ms=Number(els.period.value);
  if(state.dds&&Number.isFinite(state.dds.minSamplePeriod)){
    const minMs=Math.max(1,Math.ceil(state.dds.minSamplePeriod*1000));
    if(ms<minMs){
      ms=minMs;
      if(![...els.period.options].some(o=>Number(o.value)===minMs)){
        const o=document.createElement('option');o.value=String(minMs);o.textContent=minMs+' ms (minimum čidla)';els.period.prepend(o);
      }
      els.period.value=String(minMs);
    }
  }
  const seconds=ms/1000;
  const ticks=Math.max(1,Math.round(seconds/state.info.tick));
  const p=[ticks&255,(ticks>>8)&255,(ticks>>16)&255,(ticks>>24)&255];
  log(`Perioda ${ms} ms = ${ticks} ticks`);
  await command(CMD.SET_PERIOD,p);
}

async function startMeasurement(){
  if(!state.device)return;
  els.start.disabled=true;
  try{
    await setPeriod();
    await command(CMD.START);
    state.measuring=true;
    state.count=0;
    state.graphData=[];
    state.sampleTime=0;
    state.lastDraw=0;
    els.value.textContent='—';
    drawGraph();
    els.stop.disabled=false;els.zero.disabled=false;
    setStatus('měřím','ok');
    log('START OK');
  }catch(e){
    log('Start selhal: '+e.message);
    setStatus('chyba','err');
    els.start.disabled=false;
  }
}

async function stopMeasurement(){
  if(!state.device)return;
  try{
    await command(CMD.STOP);
    log('STOP OK');
  }catch(e){
    log('STOP: '+e.message);
  }
  state.measuring=false;
  els.start.disabled=false;els.stop.disabled=true;els.zero.disabled=true;
  setStatus('připojen','ok');
}

async function connect(){
  if(!navigator.hid){
    alert('Tento prohlížeč nepodporuje WebHID. Použij Chrome nebo Edge na počítači.');
    return;
  }
  els.connect.disabled=true;
  setStatus('vybírám zařízení…');
  try{
    const devices=await navigator.hid.requestDevice({filters:[
      {vendorId:VERNIER_VID,productId:0x0002},
      {vendorId:VERNIER_VID,productId:0x0003},
      {vendorId:VERNIER_VID,productId:0x0004}
    ]});
    const device=devices?.[0];
    if(!device)throw new DOMException('Nebylo vybráno zařízení.','NotFoundError');

    await device.open();
    state.device=device;
    state.info=PRODUCTS[device.productId]||{name:'Neznámý Vernier',tick:.001,defaultMs:100,kind:'unknown'};
    state.sensorId=null;state.dds=null;state.offset=0;state.lastRaw=NaN;state.lastValue=NaN;
    state.graphData=[];state.sampleTime=0;
    state.outReportId=findOutReportId(device);
    device.addEventListener('inputreport',onInputReport);

    els.deviceName.textContent=state.info.name;
    els.deviceMeta.textContent=device.productName||'Vernier USB HID';
    els.period.value=String(state.info.defaultMs);
    if(![...els.period.options].some(o=>o.value===els.period.value)){
      const o=document.createElement('option');o.value=String(state.info.defaultMs);o.textContent=state.info.defaultMs+' ms';els.period.prepend(o);els.period.value=o.value;
    }

    els.disconnect.disabled=false;els.start.disabled=false;els.period.disabled=false;
    setStatus('připojen','ok');
    log(`Připojeno ${state.info.name}, VID ${hex(device.vendorId)}, PID ${hex(device.productId)}, OUT report ${state.outReportId}`);

    await initDevice();
  }catch(e){
    console.error(e);
    const cancelled=e?.name==='NotFoundError'||/cancel/i.test(String(e));
    setStatus(cancelled?'výběr zrušen':'chyba',cancelled?'':'err');
    if(!cancelled)alert(e.message||String(e));
    els.connect.disabled=false;
  }finally{
    if(state.device)els.connect.disabled=true;
  }
}

async function disconnect(){
  if(!state.device)return;
  try{if(state.measuring)await stopMeasurement()}catch(_){}
  try{state.device.removeEventListener('inputreport',onInputReport)}catch(_){}
  try{await state.device.close()}catch(_){}
  state.device=null;state.info=null;state.pending.clear();state.count=0;state.offset=0;state.lastRaw=NaN;state.lastValue=NaN;state.measuring=false;state.sensorId=null;state.dds=null;state.readingDDS=false;state.graphData=[];state.sampleTime=0;
  els.connect.disabled=false;els.disconnect.disabled=true;els.start.disabled=true;els.stop.disabled=true;els.zero.disabled=true;els.period.disabled=true;
  els.deviceName.textContent='—';els.deviceMeta.textContent='Podporované testovací typy: Go!Link, Go!Temp, Go!Motion.';
  els.value.textContent='—';els.unit.textContent='RAW';setStatus('nepřipojen');drawGraph();
  log('Odpojeno');
}

els.connect.addEventListener('click',connect);
els.disconnect.addEventListener('click',disconnect);
els.start.addEventListener('click',startMeasurement);
els.stop.addEventListener('click',stopMeasurement);
els.graphFit.addEventListener('click',()=>setGraphMode('fit'));
els.graphScroll.addEventListener('click',()=>setGraphMode('scroll'));
els.graphWindow.addEventListener('change',drawGraph);
new ResizeObserver(drawGraph).observe(els.graphWrap);
setGraphMode('fit');

els.zero.addEventListener('click',()=>{
  if(!Number.isFinite(state.lastRaw))return;
  if(state.dds){
    const v=physicalValue(state.lastRaw);
    if(!Number.isFinite(v))return;
    state.offset=v;
    els.value.textContent='0';
    log('Nula zobrazení nastavena na '+formatMeasured(v)+' '+els.unit.textContent);
    drawGraph();
  }else{
    state.offset=state.lastRaw;
    els.value.textContent='0';
    log('RAW nula nastavena na '+state.offset);
    drawGraph();
  }
});
})();
</script>
